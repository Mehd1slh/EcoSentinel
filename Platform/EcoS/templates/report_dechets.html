<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Waste Report Form</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">

  <style>
    body.dechets-page {
      background: url("/static/pubelle.jpg") no-repeat center center fixed;
      background-size: cover;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    body.dechets-page::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(75, 71, 71, 0.4);
      z-index: -1;
    }
  </style>
</head>

<body class="dechets-page">
  <div class="form-container">
    <div class="form-header">
      <h1><i class="fas fa-trash-alt"></i> Waste Report Form</h1>
      <p>Help us manage waste efficiently</p>
    </div>

    <form class="pollution-form" method="post">
      <div class="form-group">
        <label for="location">Your Location</label>
        <input type="text" id="location" name="location" placeholder="Enter your location" required>
      </div>

      <div class="form-group">
        <label>Your Issue</label>
        <div class="radio-group">
          <div class="radio-option selected">
            <div class="icon"></div>
            <div class="text">Bins Full</div>
            <input type="radio" name="need" value="pleines" checked>
          </div>
          <div class="radio-option">
            <div class="icon"></div>
            <div class="text">Not Collected</div>
            <input type="radio" name="need" value="non-ramassees">
          </div>
          <div class="radio-option">
            <div class="icon"></div>
            <div class="text">Other</div>
            <input type="radio" name="need" value="autre">
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="message">Additional Message</label>
        <textarea id="message" name="message" placeholder="Describe the situation..."></textarea>
      </div>

      <button type="submit" class="submit-btn">
        <i class="fas fa-paper-plane"></i> Submit
      </button>
    </form>

    <div class="form-footer">
      <p>© 2025 EcoSentinel Team – Thank you for your report</p>
    </div>
  </div>

  <script>
    document.querySelectorAll('.radio-option').forEach(option => {
      option.addEventListener('click', function () {
        this.parentNode.querySelectorAll('.radio-option').forEach(el => {
          el.classList.remove('selected');
        });
        this.classList.add('selected');
        this.querySelector('input[type="radio"]').checked = true;
      });
    });
  </script>
</body>
</html>
