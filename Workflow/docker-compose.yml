services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    env_file:
      - ./n8n.env  # Reference your existing file
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_LOG_LEVEL=debug
      - GENERIC_TIMEZONE=Africa/Casablanca
    volumes:
      - n8n:/home/node/.n8n

volumes:
  n8n:
